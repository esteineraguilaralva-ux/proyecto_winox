<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winox | Contáctanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">WINO<span class="text-accent">X</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link text-light me-2" href="index.html">Inicio</a></li>
<li class="nav-item"><a class="nav-link text-light me-2" href="servicios.html">Servicios</a></li>
<li class="nav-item"><a class="nav-link text-light me-2" href="productos.html">Productos</a></li>
<li class="nav-item"><a class="nav-link text-light me-2" href="proyectos.html">Proyectos</a></li>
<li class="nav-item"><a class="nav-link active fw-bold text-accent me-2" href="contactanos.html">Contáctanos</a></li>

                <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                    <button id="btnTema" class="btn btn-outline-info btn-sm rounded-pill px-3">Cambiar Fondo</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card p-4 p-md-5 card-hover">
                    <div class="text-center mb-4">
                        <span class="text-accent fw-bold text-uppercase">Cotizaciones</span>
                        <h1 class="display-6 fw-bold mt-2">Hablemos de tu Proyecto</h1>
                        <p class="text-light opacity-75">Envíanos tus requerimientos y te responderemos a la brevedad.</p>
                    </div>

                    <form id="contactForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label text-light fw-semibold">Nombre Completo</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="nombre" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label text-light fw-semibold">Correo Electrónico</label>
                                <input type="email" class="form-control bg-dark text-light border-secondary" id="email" placeholder="nombre@ejemplo.com" required>
                            </div>
                            <div class="col-12">
                                <label for="asunto" class="form-label text-light fw-semibold">Asunto / Tipo de Servicio</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="asunto" placeholder="Cotización de barandas, mobiliario, etc.">
                            </div>
                            <div class="col-12">
                                <label for="mensaje" class="form-label text-light fw-semibold">Detalles del Mensaje</label>
                                <textarea class="form-control bg-dark text-light border-secondary" id="mensaje" rows="4" placeholder="Medidas aproximadas, especificaciones técnicas, ubicación..." required></textarea>
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="btn btn-custom-primary btn-lg px-5 rounded-pill">Enviar Mensaje</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="py-4 text-center text-light">
    <div class="container">
        <p class="mb-1"><strong>WINOX</strong> · Acero que da forma a tus ideas.</p>
        <small class="text-muted">Sitio web empresarial · Lima, Perú</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
